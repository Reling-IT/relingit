regel: Claude Code fuehrt nur Auftraege mit status bereit aus, in der Reihenfolge dieser Liste, einen zur Zeit.
gemeinsame_regeln:
- Sprache Deutsch, sachlich, Anforderungen mit muss/sollte. Daten als JSON oder YAML, Diagramme als Mermaid.
- 'Zu Beginn lesen: README.md, scripts/publish-release.ps1, scripts/ci-check.ps1.'
- Arbeit nur auf einem Feature-Branch (auftrag-<id>-<kurzname>), nie auf main. Pull Request oeffnen (gh, sonst Link ausgeben). Nicht mergen, kein Tag, keine Veroeffentlichung.
- Buchtext (source/fahrt-zum-kunden.html, story/current/fahrt-zum-kunden.html) und PDFs nur aendern, wenn der Auftrag es ausdruecklich verlangt.
- Nichts an Workflows (.github/workflows), Deployment, FTP, Supabase-Konfiguration oder Admin-Konten aendern. Keine Zugangsdaten in Dateien oder Commits.
- Aussagen wie 'geprueft' oder 'bestanden' nur mit Beleg (Befehl und Ergebnis, PR, Commit, CI-Lauf).
- 'Abschluss jedes Berichts: Hygiene in einer Zeile (gemergte Remote-Branches, offene PRs, Drafts) und YAML-Block mit Reifegrad, Projektstatus, Offene_Fragen, Roadmap (Sprints_bis_BSF, Sprints_bis_MVP).'
