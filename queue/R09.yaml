id: R09
titel: Live-Pruefung v1.40 nach dem Upload (nur lesend)
art: lesen
gate: nein
abhaengig_von: []
voraussetzung: Bernd hat v1.38 hochgeladen (Paket 76692313...984C bzw. A906DDF4...205A, nicht 7118198F...) und setzt den Status auf bereit. Vorher nicht beginnen.
ziel: Belegen, dass die Live-Seite berndmarnau.de/relingit dem Stand von main und story/current entspricht.
schritte:
- 'Stand von main und story/current lesen: Version, Datum, Seitenzahl aus dem Deckblatt der Quelle und der PDF (pdfinfo), fallbackRelease in assets/js/app.js.'
- 'Per HTTP GET (ohne Anmeldung) abrufen: Startseite, lesen.html, handout.html, impressum.html, datenschutz.html, admin.html (nur die Anmeldeseite), die PDF und die Lesefassung. HTTP-Status je Datei und Groesse notieren.'
- 'Vergleichen: Seitenzahl und Version auf Startseite und Lesefassung gegen die Quelle; Repo-Link muss Reling-IT/relingit lauten (kein bmarnau/relingit); in supabase-config.js darf kein Platzhalter HIER_ stehen; .htaccess-Wirkung (Weiterleitungen, Sperren) nur beschreiben, soweit ohne Anmeldung pruefbar.'
- Abweichungen als Liste mit Datei, Soll, Ist melden. Nichts selbst korrigieren.
nachweis: Bericht reports/R09-BERICHT.md mit Abrufzeit, HTTP-Status je Datei und Soll-Ist-Tabelle.
grenzen: Nur lesende Abrufe. Keine Anmeldung, kein Admin-Konto, kein Supabase-Zugriff, kein FTP, keine Aenderung im Repo ausser dem Bericht auf ops/reports. Keine Zugangsdaten.
status: erledigt
stand: 2026-11-23 16:30
hinweis_planung_2026_11_11: 'Bernd 11.11.: Upload erst, wenn v1.39 fertig ist; Entscheidung am Mo 16.11.2026: nur v1.39 oder v1.38 als Fallback. Dieser Auftrag bezieht sich dann auf die hochgeladene Version. Nicht beginnen, bevor Bernd die Version nennt.'
hinweis_planung_2026_11_16: 'Prueft v1.39: Version 1.39, Datum 15. November 2026, 80 Seiten, Anhang mit neun Standards, Handout-Datum Ende November 2026, Anhang-Seite, Startseite. Nach dem Upload (Zeitpunkt Bernd: jetzt oder mit Trailer).'
hinweis_lage_2026_11_16: 'Haengt am Upload v1.39 durch Bernd, geplant in rund einer Woche (Paket mit Trailer und Link CDF23C5F...9218 nach Merge von #38 und #39). Erst danach R09, dann R52, dann R53.'
hinweis_2026_11_23: 'v1.40 ist per FTP hochgeladen. Pruefen: Zeile Version/Seiten/Datum auf der Startseite (kommt aus Supabase story_release, nicht aus dem FTP), PDF- und Handout-Link (Supabase-Speicher story/current), index.html und app.js Server gegen main (Zeilenenden normalisieren). Siehe R87.'
ergebnis_2026_11_23: Erster Lauf 14:21 UTC nicht bestanden (Supabase stand auf v1.37/64 Seiten/5. September 2026). Nach Freigabe von Bernd hat Claude Code story_release und die vier Dateien in story/current per Skript aktualisiert (reports/R09-NACHPRUEFUNG-v1.40.md); Nachpruefung 14:52 UTC bestanden. Schluessel nach Bernds Angabe lokal; Entfernen und Drehen durch Bernd offen.
