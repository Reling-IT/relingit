id: R13
titel: 'Aufraeumen im Ordner C:\Users\bmarn\OneDrive\HTML\reling it: nicht mehr benoetigte Dateien loeschen (zweistufig, mit Freigabe)'
art: lokal-loeschen
gate: ja
abhaengig_von:
- R34
pfad: C:\Users\bmarn\OneDrive\HTML\reling it
voraussetzung: Bernd setzt den Status auf bereit. Phase 1 (nur lesen) laeuft ohne weitere Freigabe, Phase 2 (loeschen) nur nach schriftlicher Bestaetigung der Liste durch Bernd im Chat der Sitzung. Ohne Bestaetigung nichts loeschen.
ziel: Den Ordner von Altlasten befreien (Zwischenstaende, Testausgaben, alte Pakete), ohne Arbeit zu verlieren. Der Ordner ist eine aeltere Arbeitskopie von Reling-IT/relingit (Branch codex/fix-admin-password-recovery) mit lokalen Aenderungen und dem Podcast-Audio. Die aktuelle Arbeitskopie ist C:\dev\relingit.
schutzregeln:
- 'Nie loeschen: .git, .github, alle von Git verfolgten Dateien (git ls-files), alle Dateien mit lokalen Aenderungen (git status), assets\audio und assets\img\reling-it-podcast-cover.png (Podcast, nicht im Repo), ideen\ (Bernds Ideen und Bilder), archive\README.md.'
- 'Nie loeschen: die jeweils neuesten zwei Pakete in output\ftp und archive\ftp-packages sowie das neueste PDF in output\pdf.'
- Nur innerhalb des genannten Ordners arbeiten. Keine Pfade ausserhalb, keine Platzhalter ausserhalb des Ordners, keine Links verfolgen (Junctions und Symlinks nicht betreten).
- Geloescht wird nur in den Papierkorb (Windows, Wiederherstellung moeglich), nie endgueltig. Dafuer die Funktion Microsoft.VisualBasic.FileIO.FileSystem mit RecycleOption SendToRecycleBin verwenden. Wenn der Papierkorb nicht verfuegbar ist (OneDrive-Pfad ohne Papierkorb), nicht loeschen, sondern melden.
- Keine Aenderung an Git (kein Checkout, kein Reset, kein Clean, kein Commit, kein Push). Kein git clean.
phase_1_nur_lesen:
- Inventar des Ordners nach Verzeichnis mit Groessen und Datum erstellen. Alles was nicht von Git verfolgt wird, einzeln klassifizieren.
- 'Kandidatenliste fuer die Loeschung erstellen: zuerst archive\_aufgeraeumt-2026-11-06 (alte Buchstaende, Flyer, alte FTP-Pakete, tmp-Inhalt), dann output\image und output\pdf (Zwischenausgaben), dann aeltere output\ftp-Pakete ausser den neuesten zwei. Jeder Eintrag mit Pfad, Groesse, Datum, Grund.'
- Doppelte Dateien erkennen (gleicher Hash) und markieren, aber nur melden.
- Liste als reports/R13-LISTE.md auf ops/reports ablegen und Bernd in der Sitzung zur Bestaetigung vorlegen. Dann stoppen.
phase_2_loeschen:
- Nur nach ausdruecklicher Bestaetigung von Bernd in der Sitzung. Nur die bestaetigten Eintraege, keine weiteren.
- Vorher Probelauf mit -WhatIf bzw. Ausgabe der exakten Pfade, dann Loeschen in den Papierkorb.
- 'Danach git status vergleichen: er muss vor und nach der Aktion identisch sein. Abweichung sofort melden.'
nachweis: Bericht reports/R13-BERICHT.md mit Liste der geloeschten Eintraege, freigegebener Liste, git status vorher und nachher, freigewordenem Speicher.
grenzen: Kein Zugriff ausserhalb des Ordners. Kein endgueltiges Loeschen. Keine Aenderung am Repo oder an der Git-Historie. Keine Zugangsdaten. Kein Merge, kein Push nach main.
status: wartet_auf_entscheidung
freigabe: 'Bernd 07.11.2026 06:44: Ja, R13 gemeinsam mit dem Tagesabschluss ausfuehren. Der Status wird von der Planer-Session am Sitzungsende auf bereit gesetzt. Stufe 1 (Liste) darf laufen; Loeschen weiterhin erst nach Bestaetigung der Liste durch Bernd, nur in den Papierkorb.'
schutzliste: 'Nicht auf die Loeschliste: assets/audio/*.mp3, assets/img/reling-it-podcast-cover.png, output/ftp/*podcast* (einzige Zweitkopie), uncommittete Aenderungen im OneDrive-Klon (index.html, datenschutz.html, styles.css, README.md, scripts/*), solange R34 nicht gemergt und R35 nicht entschieden ist. Diese Dateien nur melden.'
stand: 2026-11-07 06:58
