id: R27
titel: Schriften des Buchs lokal per @font-face einbinden (reproduzierbare Seitenzahl)
art: code-pr
gate: nein
abhaengig_von:
- R14
- R26
voraussetzung: 'Erfuellt: R26 erledigt (Commit 9dfdc54 auf dem Branch von PR #10), PR #11 gemergt.'
ziel: 'Die drei Schriften der Quelle (Fraunces, Work Sans, IBM Plex Mono) werden mitgeliefert, damit die PDF auf jedem Rechner dieselbe Seitenzahl ergibt (Befund R14: Seitenzahl haengt vom Rechner ab).'
schritte:
- 'Auf dem Branch geschichte-veraltete-daten-20261107 (PR #10) weiterarbeiten, nicht von main abzweigen. Lizenzen der drei Schriften pruefen (erwartet SIL Open Font License) und im Bericht belegen; Lizenztexte in assets/fonts/ ablegen.'
- Schriftdateien (woff2, nur benoetigte Schnitte und Zeichensaetze) ohne Zugangsdaten aus den offiziellen Quellen laden, SHA-256 notieren, unter assets/fonts/ ablegen.
- In source/fahrt-zum-kunden.html @font-face einbinden, so dass auch das gerenderte PDF die Schriften nutzt (pdffonts belegt es). Die Datei darf danach nicht von externen Servern laden. Dateigroesse der HTML vor und nach melden; Schriften nur als Dateien einbinden, nicht als Base64, falls das die Quelle zu gross macht.
- 'story/current, lesen.html und scripts/build-upload.ps1 pruefen: Wird assets/fonts mit ausgeliefert, und ist die Lesefassung davon betroffen? Aenderungen nur, wenn noetig, und als FTP-Hinweis im Bericht nennen.'
- PDF mit den Werkzeugen aus docs/PDF-ERZEUGEN.md auf Bernds Rechner rendern und die Seitenzahl notieren; Ergebnis mit der Cloud-Probe (76 Seiten) vergleichen. PDF nicht committen.
nachweis: Pull Request, Bericht reports/R27-BERICHT.md mit Lizenzbeleg, Hashes, pdffonts-Ausgabe und Seitenzahl.
grenzen: Kein Merge, kein Tag, keine Veroeffentlichung, kein FTP, keine Zugangsdaten, keine Aenderung an .github/workflows, Deployment, Supabase-Konfiguration oder Admin-Konten. Kein Buchtext, keine PDF im Commit.
hinweis: 'Release-Kette v1.38: Jede Aenderung an source/fahrt-zum-kunden.html macht die CI rot, solange story/current nicht neu erzeugt ist. Deshalb alle Quelltext-Aenderungen der Version v1.38 (R26, R27, R16) als Commits auf demselben Branch geschichte-veraltete-daten-20261107 (PR #10) stapeln, nicht als eigene PRs auf main.'
