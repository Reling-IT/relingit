- 'F2: Report-Namen im Text, in der SVG und in der Bildunterschrift klein wie die Repos: ireport, qreport, nreport, sreport, areport. Historie unberuehrt. F3: K7 "der interne SharePoint". F4: K9 die Formel "Genau die Art ..." von 4 auf 1 Vorkommen ausduennen, "kurz"-Haeufung Z. 896 aufloesen. F5: K15 nichts aendern (Motto bleibt, gewollt).'
