id: R43
titel: 'Qualitaetssicherung vor jeder Freigabe: FREIGABE.md, freigabe.yaml, freigabe-pruefen.ps1, lokale Vorschau und Sichtungsliste'
art: code-pr
gate: nein
abhaengig_von:
- R39
- R40
ziel: 'Jede neue Version durchlaeuft vor der Freigabe die Tore G1 Code, G2 Kommentare, G3 Layout, G4 UI, G5 Inhalt, G6 Lokal, G7 Git, G8 Freigabe Bernd (Entscheidung Bernd 08.11.). Quelle der Tore: Reiter Freigabe der Abstimmungsseite, Entwurf freigabe.yaml. Bernd muss die Version vor der Freigabe lokal selbst sichten koennen (Entscheidung 08.11.).'
schritte:
- Neuer Branch auftrag-r43-freigabe von aktuellem origin/main.
- 'docs/FREIGABE.md (Prozess, Tore, Nachweise, Rollen, Regel: kein Merge, Tag oder Upload bei offenem Tor) und docs/freigabe.yaml (maschinenlesbar, gueltiges YAML) anlegen; in README und docs/ABLAUF.md verlinken.'
- 'scripts/freigabe-pruefen.ps1: fuehrt die automatisierbaren Pruefungen aus (ci-check.ps1, Pester, node --check, git status sauber, Hash-Pruefung Podcast, Branch/PR-Stand per gh falls vorhanden) und schreibt reports/FREIGABE-vX.YY.md (Tabelle Tor, Ergebnis, Nachweis). Kopfkommentar mit Zweck, Eingabe, Ausgabe. Tore ohne Automatik (G3 Sichtung, G4 Breiten, G5 Lesen, G8) als offen ausgeben, nie als bestanden.'
- 'scripts/vorschau.ps1: baut die Seite aus dem aktuellen Zweig in ein temporaeres Verzeichnis ausserhalb des Repos, startet einen lokalen Webserver nur auf 127.0.0.1 (z. B. python -m http.server, Port frei waehlbar) und oeffnet index.html im Standardbrowser; Beenden mit Strg+C. Kein FTP, keine Zugangsdaten, keine Netzwerkzugriffe ausser dem lokalen Server. Optional PDF aus output/ oder story/current oeffnen.'
- 'Sichtungsliste: das Skript erzeugt reports/SICHTUNG-vX.YY.md mit Pruefpunkten (Startseite, Lesefassung, Handout, Datenschutz, Impressum, Podcast-Player je 390/768/1280 px; PDF: Deckblatt, neue Szene, Codebox, SVG-Seite, Mini-TOC, Seitenzahl) und Spalten Ergebnis (Ja/Nein) und Bemerkung. Bernd traegt das Ergebnis ein; der Bericht gilt als Nachweis fuer G3, G4 und G5, G8 bleibt gesperrt, solange Nein-Punkte offen sind.'
- Pester-Test fuer das Skript; ci-check.ps1 und build-upload.ps1 duerfen nicht veraendert werden, ausser eine Pflichtdateiliste verlangt die neuen Dateien.
- Probelauf auf dem Release-Zweig geschichte-veraltete-daten-20261107 (nur lesen, nichts aendern) und Ergebnis im Bericht reports/R43-BERICHT.md. Bericht vor dem Push gegen die Schluesselmuster aus ci.yml und ci-check.ps1 pruefen.
nachweis: Pull Request, Bericht mit Probelauf.
grenzen: Kein Merge, kein Tag, keine Veroeffentlichung, kein FTP, keine Zugangsdaten, keine Aenderung an .github/workflows, Deployment, Supabase-Konfiguration oder Admin-Konten. Kein Buchtext, keine PDF.
