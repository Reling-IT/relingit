id: R87
titel: 'Upload-Ablauf verbessern: Supabase-Eintrag und Speicher als eigener, gepruefter Schritt (Checkliste, publish-release.ps1, R09)'
art: code-pr
gate: ja
abhaengig_von: []
stand: 2026-11-23 18:30
planer: Claude (Planer-Session)
repo: Reling-IT/relingit
ziel: 'Anlass 23.11.2026: Nach dem FTP-Upload von v1.40 zeigte die Startseite weiter Version 1.37, 64 Seiten und 5. September 2026. Ursache: Die Zeile Version/Seiten/aktualisiert am kommt aus Supabase (Tabelle story_release, id=current), die Links zu PDF, Handout und Lesefassung zeigen auf den Supabase-Speicher story/current. Beides aendert der FTP-Upload nicht. Der Ablauf behandelt diesen Schritt bisher nur als Handschritt im Admin-Bereich ohne Sollwerte und ohne Pruefung. Ziel: Der Upload-Ablauf nennt den Schritt ausdruecklich, kennt die Sollwerte und prueft vor und nach dem Schreiben nur lesend.'
schritte:
- 'Teil 1 pruefen: PR #42 (Doku) lesen, Aussagen gegen docs/NEUE-GESCHICHTE.md Abschnitt 5, SUPABASE-ANLEITUNG.md und setup.sql abgleichen; Korrekturen als Commit auf den PR-Branch. Teil 2 im selben oder einem Folge-PR.'
- 'Ist-Ablauf lesen: scripts/publish-release.ps1, scripts/build-upload.ps1, scripts/pruefe-paket.ps1, docs-Dateien zum Upload, UPLOAD-CHECKLISTE-v1.39.md und v1.40.md. Meldung "FTP-Upload noetig: nein" (Vergleich nur mit dem letzten Commit) beheben oder klar kennzeichnen.'
- 'Sollwerte automatisch ableiten und in jede Upload-Checkliste schreiben: Version, Datum (Renderdatum) und Seitenzahl aus Buchquelle und PDF; dazu Hash und Groesse der vier Dateien in story/current (geschichte.pdf, fahrt-zum-kunden.html, workshop-handout.pdf, workshop-handout.html).'
- 'Eigener Abschnitt "Supabase und Speicher" in der Checkliste (Reihenfolge: 1 FTP, 2 Admin-Eintrag story_release, 3 Speicher story/current, 4 Live-Pruefung). Hinweis aufnehmen: FTP aendert die Startseitenzeile nicht; bei Abweichung zuerst privates Fenster oder harter Neuladen, dann Supabase pruefen.'
- 'Neuer lesender Modus (z. B. publish-release.ps1 -NurPruefen): liest story_release (id=current) mit dem oeffentlichen Schluessel aus assets/js/supabase-config.js, vergleicht mit den Sollwerten, liest die Speicherdateien und deren Hashes, vergleicht index.html und assets auf dem Server mit main (Hash nach Normalisierung der Zeilenenden CRLF zu LF). Ausgabe als Tabelle Soll, Ist, Ergebnis; Exit-Code ungleich 0 bei Abweichung.'
- 'Schreibmodus nur mit ausdruecklicher Freigabe von Bernd im Auftrag (Umfang: story_release id=current, Dateien in story/current; nichts loeschen, Live-MP3 nie). Vor dem Schreiben Tabelle alt/neu zeigen; nach dem Schreiben automatisch -NurPruefen.'
- 'R09 (Live-Pruefung) um denselben lesenden Abgleich ergaenzen: Zeile Version/Seiten/Datum, PDF- und Handout-Link, Deckblatt, Fallback in assets/js/app.js.'
- Pester-Tests fuer Sollwert-Ableitung und Abgleich (mit Testdaten, ohne Netz), ci-check unveraendert gruen; docs/FREIGABE.md und die Upload-Checkliste verlinken.
- 'Klaeren, wie das Skript schreibt: Der Admin-Bereich (admin.html) verlangt Administratorkonto plus Authenticator-Code (docs/NEUE-GESCHICHTE.md Abschnitt 5, setup.sql: nur is_story_admin() darf schreiben). Ein Skript mit Admin-Anmeldung ist daher kaum moeglich; der Secret Key umgeht die Zugriffsregeln. Vorschlag mit Begruendung und Risiken an Bernd; Standardweg bleibt der Admin-Bereich durch Bernd.'
nachweis: Draft-PR mit Vorher/Nachher, Pester gruen, ci-check Exit 0, Probelauf -NurPruefen gegen den Live-Stand (Bericht mit Tabelle Soll, Ist, Ergebnis)
grenzen: Kein Merge, kein Tag, kein FTP, kein Upload ohne Freigabe von Bernd. Kein Schreiben in Supabase im Probelauf (nur lesen). Keine Aenderung an .github/workflows, Deployment, Admin-Konten oder Schutzregeln. Keine Zugangsdaten in Dateien oder Berichten.
status: bereit
hinweis: Beruehrt scripts/publish-release.ps1 und freigabe-pruefen.ps1 nicht gleichzeitig mit R78/R68 aendern; Reihenfolge mit R78 und R68 im selben PR klaeren, wenn beide Auftraege offen sind.
teil_1_doku: 'Teil 1 (Doku) gemergt: PR #42 am 23.11.2026, main f48da7b (durch Claude Code nach Freigabe Bernd, Head 53e0a48). docs/SUPABASE-BETRIEB.md liegt auf main. Teil 2 (Skripte, Tests, Checklistenvorlage, Schreibweg vorschlagen) offen.'
hinweis_2026_11_23: 'Ausloeser (Supabase-Eintrag nicht nachgezogen) ist behoben, der Auftrag bleibt sinnvoll: feste Pruefung fuer Supabase im Upload-Ablauf, Betriebsdoku (PR #42). Schreibweg klaeren (Skript mit Secret Key hat am 23.11. funktioniert, Admin-Bereich ist Standardweg).'
entscheidung_bernd_2026_11_23: Der Supabase-Schluessel bleibt gueltig (nicht gedreht). Er darf nur als Umgebungsvariable in der Sitzung des Owners liegen, nie in Dateien, Berichten, Commits, $PROFILE oder .env. Jede Nutzung braucht weiter die ausdrueckliche Freigabe im Auftrag (Umfang story_release id=current und story/current). Schreibweg und Rotation in R87 Teil 2 ansprechen.
freigabe_merge_2026_11_23: 'Bernd: "Merge ja" (23.11.2026, nach Nachfrage zu PR #42). Gilt nur fuer PR #42, Head 53e0a48ff594280731f6fcda25ec5ce3d11ea729 (3 Dateien, +65 -0, CI Website pruefen gruen). Ausfuehrung durch Claude Code: gh pr ready, Head pruefen (bei geaendertem Head neu fragen), Merge mit --match-head-commit, danach main und CI pruefen. Teil 2 bleibt offen.'
entscheidung_schreibweg_2026_11_23: 'Bernd: Schreibweg ist der Admin-Bereich durch Bernd (Standardweg, docs/NEUE-GESCHICHTE.md Abschnitt 5). Skripte lesen nur (-NurPruefen, R09); kein Secret Key fuer Skripte im Regelfall. Teil 2: Pruefmodus, Sollwerte, Checklistenvorlage, Tests; Schreibmodus nur als dokumentierte Ausnahme (Notfall, Neuanlage) mit Freigabe je Lauf. Der Schluessel bleibt gueltig (Entscheidung Bernd 23.11.).'
freigabe_merge_44_2026_11_23: 'Bernd: Merge ja fuer PR #44 (Doku Tarif Pro in docs/SUPABASE-BETRIEB.md), Head b9dea070d1171c21b9ba66f733f6e2687a9f5bf6, nur dieser Head. Ausfuehrung durch Claude Code: gh pr ready, Head und CI pruefen, Merge mit --match-head-commit. Hinweis: Projekt liegt seit 23.11.2026 in einer Pro-Organisation (Angabe Bernd, nicht von mir geprueft).'
hinweis_backup_2026_11_23: 'Bernd 23.11.: Im Pro-Tarif gibt es Backups (Angabe Bernd; Umfang und Aufbewahrung nicht dokumentiert, Planer hat keinen Dashboard-Zugriff). Datei-Backups des Speichers sind separat zu klaeren: Datenbank-Backups ersetzen keinen Export von reader_feedback und der Speicherdateien. In docs/SUPABASE-BETRIEB.md Abschnitt Sicherung mit konkreten Angaben (Frist, Wiederherstellungsweg) nachziehen, sobald Bernd sie nennt.'
